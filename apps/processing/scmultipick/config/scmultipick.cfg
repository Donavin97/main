# scmultipick - Multi-Phase Picker Configuration
# Sends to the PICK group
connection.primaryGroup = PICK

# Send amplitudes to this group
connection.amplitudeGroup = AMPLITUDE

# Receive objects from CONFIG group
connection.subscriptions = CONFIG

# ============================================================================
# Basic Configuration
# ============================================================================

# The waveform ringbuffer size in seconds
ringBufferSize = 300

# Use all streams that are received by the picker. This option has only effect if a
# file is used as input which contains more data than the picker requests.
useAllStreams = false

# Enable sensitivity correction (convert counts to physical units m/s)
sensitivityCorrection = false

# Enables/disables amplitude calculation
calculateAmplitudes = true

# The default channel to pick on for a station without component code
defaultChannel = "BH"

# The default filter when no per station configuration has been read
defaultFilter = "RMHP(10)>>ITAPER(30)>>BW(4,0.7,2)>>STALTA(2,80)"

# The default filter for S-phase picking on horizontal components
defaultSFilter = "RMHP(10)>>ITAPER(30)>>BW(4,0.5,1.5)>>STALTA(2,80)"

# The default time correction in seconds to apply when a pick is going to be emitted
defaultTimeCorrection = -0.8

# The timespan in seconds that will be subtracted from NOW to acquire records
leadTime = 60.0

# The initialization time per stream in seconds after the first record has been received
initTime = 60.0

# The phase hint for primary picks
phaseHint = "P"

# The phase hint for secondary picks
secondaryPhaseHint = "S"

# Whether to kill previously started secondary pickers when a new primary pick has been declared
killPendingSPickers = true

# The feature extraction type to use
fx = ""

# Enables/disables gap interpolation
interpolateGaps = false

# Send detections as well if a picker is configured
sendDetections = false

# Enable extra pick comments
extraPickComments = false

# Accept historic data in real-time playbacks
playback = false

# Generate simplified pick and amplitude IDs
simplifiedIDs = false

# The amplitude types to be computed by the picker based on picks
amplitudes = "MLv, mb, mB"

# The amplitude types that can be updated
amplitudes.enableUpdate = ""

# Global minimum SNR for amplitude processors (fallback)
minSNR = 3.0

# The picker type to use for primary phase detection
picker = "AIC"

# The secondary picker type to use for S-phase detection
spickerType = "S-L2"

# Enable automatic comments added to the pick
comment.ID = ""
comment.text = ""

# ============================================================================
# Threshold Configuration
# ============================================================================

# For which value on the filtered waveforms is a pick detected
thresholds.triggerOn = 3.0

# The value the filtered waveforms must reach to enable detection again
thresholds.triggerOff = 1.5

# The dead time in seconds after a pick has been triggered
thresholds.deadTime = 30.0

# The minimum duration of a trigger, negative value = disabled
thresholds.minDuration = -1

# The maximum duration of a trigger, negative value = disabled
thresholds.maxDuration = -1

# The maximum gap length in seconds to handle. Gaps larger than this will cause the picker to be reset
thresholds.maxGapLength = 4.5

# The time window used to compute a maximum (snr) amplitude on the filtered waveforms
thresholds.amplMaxTimeWindow = 10.0

# The amplitude used together with measured amplitude and `thresholds.deadTime` for scaling the amplitude below which the picker is inactive after a P pick. The value is typically similar to the trigger threshold
thresholds.minAmplOffset = 3.0

# ============================================================================
# Multi-Phase Configuration
# ============================================================================

# Enable/disable P-phase picking
multipick.enablePPhases = true

# Enable/disable S-phase picking
multipick.enableSPhases = true

# Enable/disable regional phase picking (Pg, Sg, etc.)
multipick.enableRegionalPhases = true

# Enable/disable core phase picking (PKP, PKIKP, etc.)
multipick.enableCorePhases = false

# Phase classification method: "auto", "component", "polarization"
multipick.phaseClassificationMethod = auto

# Minimum SNR for S-phase detection
multipick.minSPhaseSNR = 1.5

# Minimum SNR for P-phase detection
multipick.minPPhaseSNR = 2.0

# Time window for S-phase search after P pick (seconds)
multipick.sPhaseSearchWindow = 60.0

# Minimum P-S time difference (seconds)
multipick.minPSTimeDiff = 1.0

# Enable automatic phase identification based on component (BHZ -> P, BHN/BHE -> S)
multipick.autoPhaseByComponent = true

# Use amplitude ratio for phase classification (H/V ratio)
multipick.useAmplitudeRatio = true

# Expected V/H amplitude ratio threshold for P vs S
multipick.vhRatioThreshold = 1.5

# Enable polarization analysis for phase classification
multipick.usePolarization = false

# Maximum distance for regional phase classification (degrees)
multipick.maxRegionalDistance = 20.0

# Minimum distance for teleseismic phase classification (degrees)
multipick.minTeleseismicDistance = 30.0

# S-phase filter (if different from P-phase filter)
multipick.sFilter = ""

# S-phase trigger on threshold (if different from P-phase)
multipick.sTriggerOnThreshold = ""

# S-phase trigger off threshold (if different from P-phase)
multipick.sTriggerOffThreshold = ""

# S-phase time correction (if different from P-phase)
multipick.sTimeCorrection = ""

# S-phase picker type (if different from P-phase picker)
multipick.sPickerType = ""

# S-phase dead time
multipick.sTriggerDeadTime = 30.0

# ============================================================================
# Enhanced AIC Picker Configuration
# ============================================================================

# Enable enhanced AIC picker with two-pass approach and confidence weighting
useEnhancedAICPicker = true

# Minimum margin for AIC picker window
multipick.aicMarginMin = 5

# Maximum margin for AIC picker window
multipick.aicMarginMax = 20

# Confidence threshold for enhanced AIC picker (0.0-1.0)
multipick.aicConfidenceThreshold = 0.5

# Enable adaptive windows for enhanced AIC picker
multipick.aicAdaptiveWindows = true

# Enable multi-band processing for enhanced AIC picker
multipick.aicMultiBand = false

# Number of bands for multi-band AIC picker
multipick.aicNumBands = 3

# ============================================================================
# Station Configuration
# ============================================================================

# Station configuration file
# stationConfig = @DATADIR@/scmultipick/station.conf

# ============================================================================
# Example Usage
# ============================================================================

# Basic multi-phase picking (P and S):
#   multipick.enablePPhases = true
#   multipick.enableSPhases = true
#   multipick.phaseClassificationMethod = auto

# P-phase only (like scautopick):
#   multipick.enablePPhases = true
#   multipick.enableSPhases = false

# Advanced with polarization:
#   multipick.phaseClassificationMethod = polarization
#   multipick.useAmplitudeRatio = true

# Enhanced AIC picker for precise onsets:
#   useEnhancedAICPicker = true
#   multipick.aicMarginMin = 10
#   multipick.aicMarginMax = 30

# S-phase specific configuration:
#   multipick.enableSPhases = true
#   multipick.sFilter = "RMHP(10)>>ITAPER(30)>>BW(4,0.3,1)>>STALTA(2,80)"
#   multipick.sTriggerOnThreshold = 3.0
#   multipick.sTriggerOffThreshold = 2.0
