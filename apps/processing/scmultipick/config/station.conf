# scmultipick Station Configuration
# This file configures which stations to process and their detection parameters.
#
# Format:
# net  sta   trigOn  trigOff  timeCorrection  filter  channel  location  enabled
#
# Where:
# - net: Network code (use * for all)
# - sta: Station code (use * for all)
# - trigOn: STA/LTA trigger-on threshold
# - trigOff: STA/LTA trigger-off threshold
# - timeCorrection: Time correction in seconds
# - filter: Filter string
# - channel: Channel code (e.g., BH, HH, EH)
# - location: Location code (use * for all)
# - enabled: true/false to enable/disable this station
#
# '.' is a placeholder for "use default value"

# Process all stations with default parameters
*    *     3       1.5      -0.8            RMHP(10)>>ITAPER(30)>>BW(4,0.7,2)>>STALTA(2,80)  BH  *  true

# Example: Specific station configuration
# II   SUR   3       1.5      -0.8            RMHP(10)>>ITAPER(30)>>BW(4,0.7,2)>>STALTA(2,80)  BH  *  true
# GT   BOSA  3       1.5      -0.8            RMHP(10)>>ITAPER(30)>>BW(4,0.7,2)>>STALTA(2,80)  BH  *  true
# A1   NECS  3       1.5      -0.8            RMHP(10)>>ITAPER(30)>>BW(4,0.7,2)>>STALTA(2,80)  BH  *  true
