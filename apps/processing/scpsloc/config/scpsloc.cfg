## scpsloc Configuration File
## Advanced P/S Phase Locator for SeisComP

## Send to the LOCATION group
connection.primaryGroup = LOCATION

## Receive objects from PICK and AMPLITUDE groups
## Add LOCATION if you want to receive manual origins
connection.subscriptions = PICK, AMPLITUDE

## ============================================================================
## Standard Location Parameters
## ============================================================================

## max. permissible RMS for a location to be reported
#autoloc.maxRMS = 3.5

## max. individual residual (unweighted) for a pick to
## be used in location
#autoloc.maxResidual = 7.0

## Max. secondary azimuth gap for an origin to be reported by.
## Default is 360 degrees, i.e. no restriction based on this parameter.
#autoloc.maxSGAP = 360

## Minimum number of phases for reporting origins
#autoloc.minPhaseCount = 6

## Maximum depth for reporting origins (km)
#autoloc.maxDepth = 1000

## Arrivals with exceptionally large amplitudes may be
## flagged as XXL, allowing (in future) faster, preliminary
## "heads-up" alerts.
#autoloc.thresholdXXL = 10000.

#autoloc.maxStationDistance = 180
#autoloc.maxDistanceXXL = 10
#autoloc.minPhaseCountXXL = 4

## If the station count for stations at < 105 degrees
## distance exceeds this number, no picks at > 105 degrees will be
## used in location. They will be loosely associated, though.
#autoloc.minStaCountIgnorePKP = 15

## Clean-up interval for removing old/unused objects, in seconds
## Don't change.
#autoloc.cleanupInterval = 3600

## max. age for objects kept in memory, in seconds
## Default is 6 hours - don't change.
#autoloc.maxAge = 21600

## Don't change.
#autoloc.wakeupInterval = 5

## ============================================================================
## P/S Phase Locator Parameters (NEW)
## ============================================================================

## Enable S phase usage in location
## When enabled, S phases (S, SKS, ScS, etc.) will be automatically
## associated and used in the location process.
## Default: true
#autoloc.useSPhases = true

## Minimum S/P phase ratio for quality control
## A value of 0.0 means no requirement. Setting this to e.g. 0.3 would
## require at least 30% as many S phases as P phases. This helps ensure
## good phase balance for reliable locations.
## Default: 0.0 (no requirement)
#autoloc.minSPRatio = 0.0

## Weight multiplier for S phases relative to P phases
## A value of 1.0 means S phases have the same weight as P phases.
## Values > 1.0 give S phases higher weight, reflecting their value
## for constraining the hypocenter and improving depth resolution.
## Default: 1.2
#autoloc.sPhaseWeight = 1.2

## Use depth phases (pP, sP, sS) for improved depth resolution
## When enabled, these phases will be automatically detected and
## used to constrain the focal depth.
## Default: true
#autoloc.useDepthPhases = true

## Maximum S-P time residual for association (seconds)
## Controls how tightly S phases must match the predicted S-P time
## based on the P phase arrival. Smaller values ensure tighter
## association but may miss valid S phases with larger uncertainties.
## Default: 5.0
#autoloc.maxSPResidual = 5.0

## Minimum origin score required for S phase association
## Lower values allow S phases to associate to earlier, less-constrained origins.
## Default: 5.0
#autoloc.minScoreSPhase = 5.0

## Minimum origin score required for other S phase (ScS, SKS, etc.) association
## Slightly higher than S because these phases are less common and more uncertain.
## Default: 6.0
#autoloc.minScoreOtherSPhases = 6.0

## Require amplitudes for automatic picks to be processed
## Set to false if using pickers that don't produce amplitudes (e.g., AI pickers)
## When false, picks without amplitudes will still be processed for location.
## When true (default), picks must have amplitudes before being processed.
## Default: true
#autoloc.requireAmplitudes = true

## ============================================================================
## File Paths
## ============================================================================

## Grid configuration
#autoloc.grid = @DATADIR@/scpsloc/grid.conf

## Station configuration
#autoloc.stationConfig = @DATADIR@/scpsloc/station.conf

## This is only relevant in offline/testing mode
#locator.stationLocations = @DATADIR@/scpsloc/station-locations.conf

## ============================================================================
## Manual Picks/Origins
## ============================================================================

## Manual picks/origins can be fed back into scpsloc for two purposes:
##   * passive association to a solution from a "trusted" source so that we
##     avoid fake or wrong locations due to events outside our area of interest
##   * use the manual origins in further processing, especially the manual picks.
##     Possibly also honor an operator specified fixed depth.
## Currently we only permit use of manual picks which are then used
## instead of the corresponding automatic picks (if existing)
# autoloc.useManualPicks = false

## Log all picks received by scpsloc to this file
autoloc.pickLog = @LOGDIR@/scpsloc-picklog

# Amplitude type to be used as SNR amplitude
# Don't change unless you know exactly what you are doing.
autoloc.amplTypeSNR = snr

# Amplitude type to be used as absolute amplitude
# Don't change unless you know exactly what you are doing.
autoloc.amplTypeAbs = mb

## Use manual origins from our own agency. Essentially it means to
## use manual picks from manual origins, which is assumed to be
## better than using only automatic picks.
autoloc.useManualOrigins = false
# NOTE: If you set the above to true, then make sure to add the
# LOCATION group to connection.subscriptions!

## If scpsloc.useManualOrigins is true, adopt the depth from manual
## origins, which is especially important if it was fixed by the analyst.
autoloc.adoptManualDepth = false

## ============================================================================
## Locator Profile
## ============================================================================

## The locator profile (velocity model) to use
## Common options: iasp91, tab, ak135
#locator.profile = iasp91

## Default depth for comparison with the depth after locating (km)
## If the same location quality can be achieved while fixing the depth
## to this value, the default depth is used.
#locator.defaultDepth = 10

## Minimum depth in case there is depth resolution (km)
## The locator might converge at a depth of 0 or even negative depths.
## This is usually not desired, so the minimum depth will be used.
#locator.minimumDepth = 5

## ============================================================================
## Phase Clustering (DBSCAN-based, similar to GEMPA scanloc)
## ============================================================================

## Enable DBSCAN-based phase clustering for pick selection.
## When enabled, picks are clustered based on spatial proximity and temporal
## coherence. This helps identify groups of picks belonging to the same event,
## filter out noise/outlier picks, and improve location quality by selecting
## coherent pick sets. Useful for handling multiple simultaneous events.
## Default: false
#autoloc.clustering.enable = false

## Time epsilon for clustering (seconds).
## Picks arriving within this time window may belong to the same cluster.
## Should be large enough to account for travel time differences across
## the network (typically 10-60 seconds for regional events).
## Default: 30
#autoloc.clustering.epsTime = 30

## Distance epsilon for clustering (km).
## Picks from stations within this distance may cluster together.
## Default: 500
#autoloc.clustering.epsDist = 500

## Minimum number of picks to form a cluster.
## Clusters with fewer picks than this are not considered valid.
## Default: 3
#autoloc.clustering.minPts = 3

## Weight for time dimension in combined distance metric.
## Higher values give more weight to temporal proximity.
## Default: 1.0
#autoloc.clustering.timeWeight = 1.0

## Weight for spatial dimension in combined distance metric.
## Higher values give more weight to spatial proximity.
## Default: 1.0
#autoloc.clustering.distWeight = 1.0

## Require compatible phase types within a cluster.
## When true, P-family and S-family picks are preferentially clustered together.
## Default: true
#autoloc.clustering.usePhaseType = true

## Use travel-time corrected time for clustering.
## When enabled, adjusts temporal distance based on station separation.
## Default: true
#autoloc.clustering.useTravelTime = true

## Maximum time span within a cluster (seconds).
## Clusters spanning more than this time are not considered valid.
## Default: 60
#autoloc.clustering.maxClusterTime = 60

## Minimum phases for a valid cluster.
## Clusters must have at least this many total phases to be considered valid.
## Default: 4
#autoloc.clustering.minPhases = 4

## Use clustering to filter picks before nucleation.
## When true, picks not belonging to a valid cluster are rejected.
## This helps remove noise picks from spurious detections.
## Default: true
#autoloc.clustering.filterPicks = true

## Boost score for picks in high-quality clusters.
## When true, origins formed from picks in valid clusters get a score boost.
## This encourages the locator to prefer clustered pick combinations.
## Default: true
#autoloc.clustering.boostScore = true

## Score threshold for boosting (arbitrary units, similar to origin scores).
## Only clusters with scores above this threshold get their picks boosted.
## Default: 10.0
#autoloc.clustering.scoreThreshold = 10.0

## Score multiplier for clustered picks.
## Origins from clustered picks get their score multiplied by this factor.
## Values > 1.0 give preference to clustered pick sets.
## Default: 1.5
#autoloc.clustering.scoreMultiplier = 1.5
